[defaults]
# Localização do arquivo de inventário (hosts e grupos)
inventory = ./ansible/inventory.ini

# Desativa verificação de host key SSH (para ambientes local/dev)
# Importante: Habilitar em produção por segurança
host_key_checking = False

# Desativa geração de arquivos .retry ao encontrar erros
# Util em ambientes CI/CD para não deixar artifacts
retry_files_enabled = False

# Desativa warnings sobre features deprecadas do Ansible
# Util para manter saída limpa e legível
deprecation_warnings = False

# Formato estruturado e legível de saída dos callbacks
callback_result_format = yaml

# Solicita senha sem precisar do -K
[privilege_escalation]
become_ask_pass = true
