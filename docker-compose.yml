networks:
  project-network:
    driver: bridge
    external: true

services:
  http-server-projeto:
    build:
      context: ./app
    container_name: http-server-projeto
    networks:
      - project-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    networks:
      - project-network
    ports:
      - "80:80"
    volumes:
      - ./nginx/http-server-projeto.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - http-server-projeto
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - project-network
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - project-network
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
