---
#
# Uso: ansible-playbook ansible/playbook.yml
#
- name: FullMonitoringProject - Full Environment Provisioning
  hosts: all
  become: yes

  tasks:

    # ========================================
    # FASE 1: Preparação do Sistema
    # ========================================

    - name: "01 - Gather system facts"
      ansible.builtin.setup:
        # Coleta informações do SO (OS family, versão, etc.)

    - name: "02 - Update apt cache"
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_facts.os_family == 'Debian'
      # Atualiza índice de pacotes em Debian/Ubuntu

    - name: "03 - Check if Docker is already installed"
      ansible.builtin.command: which docker
      register: docker_installed
      failed_when: false
      changed_when: false
      # Verifica se Docker já existe no sistema

    # ========================================
    # FASE 2: Instalação de Dependências
    # ========================================

    - name: "04 - Install Docker and dependencies (Debian/Ubuntu)"
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3-docker
          - docker-compose-plugin
        state: present
      when:
        - ansible_facts.os_family == 'Debian'
        - docker_installed.rc != 0
      # Instala Docker completo apenas se não estiver presente

    - name: "05 - Install only missing dependencies (Docker present)"
      ansible.builtin.apt:
        name:
          - python3-docker
          - docker-compose-plugin
        state: present
      when:
        - ansible_facts.os_family == 'Debian'
        - docker_installed.rc == 0
      # Se Docker existe, instala apenas os possíveis complementos faltando

    - name: "06 - Start and enable Docker service"
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      # Inicia o Docker

    - name: "07 - Add current user to docker group"
      ansible.builtin.user:
        name: "{{ ansible_env.USER }}"
        groups: docker
        append: yes
      # Adiciona usuário atual ao grupo docker para permitir execução sem sudo

    - name: "08 - Reset connection to apply docker group"
      ansible.builtin.meta: reset_connection
      # Reinicia conexão para aplicar mudanças de grupo

    # ========================================
    # FASE 3: Configuração Docker
    # ========================================

    - name: "09 - Create Docker bridge network korp-network"
      ansible.builtin.shell: |
        docker network inspect project-network >/dev/null 2>&1 || docker network create project-network
      changed_when: false
      # Cria rede bridge compartilhada entre containers caso não exista

    # ========================================
    # FASE 4: Inicialização da Aplicação
    # ========================================

    - name: "10 - Build and start stack via Docker Compose"
      ansible.builtin.shell: |
        docker compose up -d --build
      args:
        chdir: "{{ playbook_dir }}/.."
      become: yes
      register: compose_result
      retries: 2
      delay: 5
      until: compose_result.rc == 0
      # Constrói imagens e inicia os 4 containers (Go, NGINX, Prometheus, Grafana)

    - name: "11 - Show Docker Compose output"
      ansible.builtin.debug:
        var: compose_result.stdout_lines
      # Exibe saída da construção

    # ========================================
    # FASE 5: Validação de Saúde dos Serviços
    # ========================================

    - name: "12 - Wait for NGINX to be reachable on port 80"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 80
        timeout: 60
      # Aguarda até 60s para NGINX ficar acessível

    - name: "13 - Validate health check endpoint"
      ansible.builtin.uri:
        url: "http://127.0.0.1/health"
        method: GET
        return_content: yes
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 12
      delay: 5
      # Valida health check do serviço Go através do NGINX

    - name: "14 - Validate service response"
      ansible.builtin.uri:
        url: "http://127.0.0.1:80/projeto"
        method: GET
        return_content: yes
        status_code: 200
      register: response
      until: response.status == 200
      retries: 12
      delay: 5
      # Valida endpoint principal /projeto

    - name: "15 - Show service response"
      ansible.builtin.debug:
        msg: "{{ response.content }}"
      # Exibe JSON com a resposta do serviço

    # ========================================
    # FASE 6: Validação de Métricas
    # ========================================

    - name: "16 - Wait for Prometheus to scrape metrics"
      ansible.builtin.wait_for:
        timeout: 30
      async: 30
      poll: 0
      # Aguarda para Prometheus coletar primeira métrica

    - name: "17 - Validate Prometheus collected metrics"
      ansible.builtin.uri:
        url: "http://127.0.0.1:9090/api/v1/query?query=service_up"
        method: GET
        return_content: yes
        status_code: 200
      register: prometheus_response
      until: prometheus_response.status == 200
      retries: 12
      delay: 5
      # Valida que Prometheus coletou métricas do serviço

    - name: "18 - Confirm Prometheus collected metrics"
      ansible.builtin.debug:
        msg: "✓ Prometheus está coletando métricas do serviço com sucesso"
      # Confirma sucesso na coleta

    # ========================================
    # FASE 7: Status Final
    # ========================================

    - name: "19 - Check running containers"
      ansible.builtin.shell: docker ps
      register: containers_output
      # Lista containers em execução

    - name: "20 - Show containers status"
      ansible.builtin.debug:
        msg: "{{ containers_output.stdout_lines }}"
      # Exibe status dos containers

    - name: "21 - Final validation summary"
      ansible.builtin.debug:
        msg: |
          Ambiente Docker provisionado com sucesso!
          Resposta do serviço: {{ response.json.nome }} - {{ response.json.horario }}
          Health Check: http://localhost/health (status: {{ health_check.status }})
          Métricas Prometheus: http://localhost:9090
          Grafana Dashboard: http://localhost:3000 (credenciais: admin/admin)
          API do Serviço: http://localhost/projeto
      # Exibe resumo final com todas as URLs e endpoints

