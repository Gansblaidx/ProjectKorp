upstream korp_backend {
    server http-server-projeto-korp:8080;

    keepalive 256;
    keepalive_requests 100000; 
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name localhost;

    location / {
        # Encaminha para o upstream definido acima
        proxy_pass http://korp_backend;

        proxy_http_version 1.1;
        # Limpa header Connection para evitar close automático
        proxy_set_header Connection "";

        # Headers necessários para o backend conhecer cliente original
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
    }
}
